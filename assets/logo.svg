<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101018"/>
      <stop offset="1" stop-color="#1c1c2e"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c8c8d4" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- app-icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- TV screen -->
  <rect x="96" y="120" width="320" height="200" rx="28"
        fill="none" stroke="url(#screen)" stroke-width="16"/>

  <!-- play glyph inside the screen -->
  <path d="M 226 170 L 226 270 L 306 220 Z" fill="url(#play)"/>

  <!-- TV stand -->
  <line x1="216" y1="344" x2="296" y2="344"
        stroke="url(#screen)" stroke-width="14" stroke-linecap="round"/>

  <!-- remote signal arcs -->
  <g fill="none" stroke="url(#play)" stroke-linecap="round">
    <path d="M 226 388 a 40 40 0 0 1 60 0" stroke-width="12" opacity="0.45"/>
    <path d="M 206 412 a 72 72 0 0 1 100 0" stroke-width="12" opacity="0.7"/>
    <path d="M 186 436 a 104 104 0 0 1 140 0" stroke-width="12"/>
  </g>
  <circle cx="256" cy="382" r="9" fill="url(#play)"/>
</svg>
